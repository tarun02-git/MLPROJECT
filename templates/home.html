<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0d0d0f;
            --paper: #f5f2eb;
            --gold: #c9a84c;
            --gold-light: #e8cb7a;
            --rust: #b85c38;
            --teal: #2a6b72;
            --muted: #7a7468;
            --border: #d4cfc5;
            --card: #ffffff;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            color: var(--ink);
            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(201,168,76,0.08) 39px, rgba(201,168,76,0.08) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(201,168,76,0.08) 39px, rgba(201,168,76,0.08) 40px);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 780px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeDown 0.7s ease both;
        }

        .header-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 0.35rem 1.1rem;
            border-radius: 2rem;
            margin-bottom: 1.4rem;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.15;
            color: var(--ink);
            margin-bottom: 0.9rem;
        }

        .header h1 span {
            color: var(--teal);
            font-style: italic;
        }

        .header p {
            color: var(--muted);
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-icon {
            color: var(--gold);
            font-size: 1.1rem;
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 4px 40px rgba(13,13,15,0.07), 0 1px 4px rgba(13,13,15,0.04);
            animation: fadeUp 0.7s 0.15s ease both;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.4rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.8rem 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--ink);
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: 0.75rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            pointer-events: none;
            font-size: 0.9rem;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
            background: #fff;
        }

        select:hover, input[type="number"]:hover {
            border-color: #b8b2a6;
        }

        /* Score section */
        .scores-section {
            margin-top: 0.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f0ede6, #faf8f4);
            border-radius: 1rem;
            border: 1px dashed var(--border);
            grid-column: 1 / -1;
        }

        .scores-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: var(--teal);
            margin-bottom: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        /* Submit button */
        .submit-wrap {
            grid-column: 1 / -1;
            margin-top: 0.5rem;
        }

        button[type="submit"] {
            width: 100%;
            padding: 1rem 2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: #fff;
            background: linear-gradient(135deg, var(--teal), #1e5058);
            border: none;
            border-radius: 0.875rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(42,107,114,0.3);
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(42,107,114,0.4);
        }
        button[type="submit"]:hover::before { opacity: 1; }
        button[type="submit"]:active { transform: translateY(0); }

        /* Result */
        .result-box {
            margin-top: 2rem;
            padding: 2rem 2.5rem;
            background: linear-gradient(135deg, var(--teal), #1e5058);
            border-radius: 1.2rem;
            text-align: center;
            color: white;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            box-shadow: 0 8px 32px rgba(42,107,114,0.35);
        }

        .result-label {
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 0.6rem;
        }

        .result-score {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            color: var(--gold-light);
        }

        .result-sub {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 580px) {
            .form-grid, .scores-grid { grid-template-columns: 1fr; }
            .card { padding: 1.8rem 1.4rem; }
            .result-score { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">

        <header class="header">
            <div class="header-badge">AI-Powered Predictor</div>
            <h1>Student Exam <span>Performance</span> Indicator</h1>
            <p>Enter student details below to predict their mathematics score using our trained machine learning model.</p>
        </header>

        <div class="divider">
            <span class="divider-icon">✦</span>
        </div>

        <div class="card">
            <form action="{{ url_for('predict_datapoint') }}" method="post">
                <div class="form-grid">

                    <!-- Gender -->
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <div class="select-wrapper">
                            <select id="gender" name="gender" required>
                                <option selected disabled value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>

                    <!-- Race / Ethnicity -->
                    <div class="form-group">
                        <label for="ethnicity">Race / Ethnicity</label>
                        <div class="select-wrapper">
                            <select id="ethnicity" name="ethnicity" required>
                                <option selected disabled value="">Select group</option>
                                <option value="group A">Group A</option>
                                <option value="group B">Group B</option>
                                <option value="group C">Group C</option>
                                <option value="group D">Group D</option>
                                <option value="group E">Group E</option>
                            </select>
                        </div>
                    </div>

                    <!-- Parental Education -->
                    <div class="form-group">
                        <label for="parental_level_of_education">Parental Education</label>
                        <div class="select-wrapper">
                            <select id="parental_level_of_education" name="parental_level_of_education" required>
                                <option selected disabled value="">Select level</option>
                                <option value="associate's degree">Associate's Degree</option>
                                <option value="bachelor's degree">Bachelor's Degree</option>
                                <option value="high school">High School</option>
                                <option value="master's degree">Master's Degree</option>
                                <option value="some college">Some College</option>
                                <option value="some high school">Some High School</option>
                            </select>
                        </div>
                    </div>

                    <!-- Lunch -->
                    <div class="form-group">
                        <label for="lunch">Lunch Type</label>
                        <div class="select-wrapper">
                            <select id="lunch" name="lunch" required>
                                <option selected disabled value="">Select type</option>
                                <option value="free/reduced">Free / Reduced</option>
                                <option value="standard">Standard</option>
                            </select>
                        </div>
                    </div>

                    <!-- Test Prep -->
                    <div class="form-group full">
                        <label for="test_preparation_course">Test Preparation Course</label>
                        <div class="select-wrapper">
                            <select id="test_preparation_course" name="test_preparation_course" required>
                                <option selected disabled value="">Select status</option>
                                <option value="none">None</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <!-- Scores -->
                    <div class="scores-section">
                        <div class="scores-section-title">
                            📝 Previous Scores
                        </div>
                        <div class="scores-grid">
                            <div class="form-group">
                                <label for="reading_score">Reading Score <span style="font-size:0.7rem;opacity:0.7">(0–100)</span></label>
                                <input type="number" id="reading_score" name="reading_score"
                                    placeholder="e.g. 72" min="0" max="100" required />
                            </div>
                            <div class="form-group">
                                <label for="writing_score">Writing Score <span style="font-size:0.7rem;opacity:0.7">(0–100)</span></label>
                                <input type="number" id="writing_score" name="writing_score"
                                    placeholder="e.g. 68" min="0" max="100" required />
                            </div>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="submit-wrap">
                        <button type="submit">Predict Mathematics Score →</button>
                    </div>

                </div>
            </form>

            {% if results is defined and results != '' %}
            <div class="result-box">
                <div class="result-label">Predicted Mathematics Score</div>
                <div class="result-score">{{ results }}</div>
                <div class="result-sub">out of 100</div>
            </div>
            {% endif %}
        </div>

    </div>
</body>
</html>
